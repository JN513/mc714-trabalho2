services:
  node1:
    build: ./src
    container_name: node1
    environment:
      - NODE_ID=1
      - PORT=5000
      - PEERS=2:node2:5000,3:node3:5000
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-1.0}
      - HEARTBEAT_TIMEOUT=${HEARTBEAT_TIMEOUT:-3.0}
    networks:
      - ds-net

  node2:
    build: ./src
    container_name: node2
    environment:
      - NODE_ID=2
      - PORT=5000
      - PEERS=1:node1:5000,3:node3:5000
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-1.0}
      - HEARTBEAT_TIMEOUT=${HEARTBEAT_TIMEOUT:-3.0}
    networks:
      - ds-net

  node3:
    build: ./src
    container_name: node3
    environment:
      - NODE_ID=3
      - PORT=5000
      - PEERS=1:node1:5000,2:node2:5000
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-1.0}
      - HEARTBEAT_TIMEOUT=${HEARTBEAT_TIMEOUT:-3.0}
    networks:
      - ds-net

networks:
  ds-net:
    driver: bridge
